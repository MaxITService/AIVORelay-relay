<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AivoRelay</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-darkest: #110f0d;
        --bg-dark: #1a1614;
        --bg-medium: #221e1b;
        --bg-card: #2a2522;
        --border: rgba(168, 85, 247, 0.2);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --text: #f5f5f5;
        --text-secondary: #a8a29e;
        --muted: #78716c;
        --accent: #a855f7;
        --accent-soft: rgba(168, 85, 247, 0.15);
        --accent-glow: rgba(168, 85, 247, 0.4);
        --error: #ef4444;
        --error-soft: rgba(239, 68, 68, 0.15);
        --warning: #f59e0b;
        --warning-soft: rgba(245, 158, 11, 0.15);
        --success: #22c55e;
        --success-soft: rgba(34, 197, 94, 0.15);
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 420px;
        height: 520px;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        padding: 12px;
        font-family: "Trebuchet MS", "Gill Sans", "Calibri", sans-serif;
        color: var(--text);
        background: linear-gradient(165deg, var(--bg-dark) 0%, var(--bg-darkest) 100%);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.3px;
        background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent-soft), rgba(168, 85, 247, 0.25));
        color: var(--accent);
        font-weight: 700;
        font-size: 11px;
        border: 1px solid rgba(168, 85, 247, 0.2);
      }

      .card {
        background: linear-gradient(145deg, var(--bg-card), var(--bg-medium));
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        box-shadow: var(--shadow);
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.3), transparent);
        pointer-events: none;
      }

      .card + .card {
        margin-top: 8px;
      }

      label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      input[type="number"],
      input[type="password"],
      input[type="text"].password-input {
        width: 100%;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-darkest);
        color: var(--text);
        font-size: 13px;
        transition: border 140ms ease, box-shadow 140ms ease;
      }

      input[type="number"]:focus,
      input[type="password"]:focus,
      input[type="text"].password-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
      }

      input[type="number"].invalid,
      input[type="password"].invalid,
      input[type="text"].password-input.invalid {
        border-color: var(--error);
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
      }

      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-wrapper input {
        padding-right: 32px;
      }

      .password-toggle {
        position: absolute;
        right: 6px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .password-toggle:hover {
        color: var(--text);
      }

      .password-toggle svg {
        width: 16px;
        height: 16px;
      }

      .password-saved {
        font-size: 10px;
        color: var(--accent);
        margin-left: 6px;
        opacity: 0;
        transition: opacity 200ms ease;
      }

      .password-saved.visible {
        opacity: 1;
      }

      .server {
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .server-url {
        font-weight: 600;
        color: var(--text-secondary);
        text-align: right;
      }

      .status {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
        min-height: 14px;
      }

      .status.error {
        color: var(--error);
      }

      /* Toggle switch styles */
      .toggle-row {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--text-secondary);
      }

      .toggle-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        cursor: pointer;
      }

      .toggle-label input {
        display: none;
      }

      .toggle-switch {
        position: relative;
        width: 36px;
        height: 20px;
        background: var(--bg-darkest);
        border: 1px solid var(--border-subtle);
        border-radius: 999px;
        transition: all 200ms ease;
        flex-shrink: 0;
      }

      .toggle-switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        background: var(--muted);
        border-radius: 50%;
        transition: all 200ms ease;
      }

      .toggle-label input:checked + .toggle-switch {
        background: var(--accent);
        border-color: var(--accent);
      }

      .toggle-label input:checked + .toggle-switch::after {
        left: 18px;
        background: white;
      }

      .toggle-hint {
        font-size: 10px;
        color: var(--muted);
      }

      .messages-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
        flex-shrink: 1;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
        min-height: 0;
      }

      .messages::-webkit-scrollbar {
        width: 4px;
      }

      .messages::-webkit-scrollbar-track {
        background: var(--bg-darkest);
        border-radius: 2px;
      }

      .messages::-webkit-scrollbar-thumb {
        background: var(--muted);
        border-radius: 2px;
      }

      .messages::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .message {
        border-radius: 10px;
        border: 1px solid var(--border-subtle);
        padding: 6px 8px;
        background: var(--bg-dark);
        animation: rise 160ms ease;
      }

      .message:hover {
        border-color: var(--border);
      }

      .message-time {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .message-text {
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
      }

      .message-status {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .attachments {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }

      .attachment {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 6px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-medium);
      }

      .attachment-thumb {
        width: 32px;
        height: 32px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid var(--border-subtle);
      }

      .attachment-icon {
        font-size: 8px;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 2px 5px;
      }

      .attachment-label {
        font-size: 10px;
        color: var(--text-secondary);
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .attachment-more {
        font-size: 10px;
        color: var(--muted);
        align-self: center;
      }

      .message-actions {
        margin-top: 4px;
        display: flex;
        justify-content: flex-end;
      }

      .retry-btn {
        background: var(--bg-medium);
        color: var(--error);
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 140ms ease;
      }

      .retry-btn:hover {
        background: var(--error-soft);
        border-color: rgba(239, 68, 68, 0.5);
      }

      .empty {
        text-align: center;
        font-size: 11px;
        color: var(--muted);
        padding: 12px 8px;
      }

      .keepalive-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #57534e, #78716c);
        transition: all 350ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .keepalive-indicator.active {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6), 0 0 3px rgba(34, 197, 94, 0.8);
        animation: pulse-glow 2s infinite;
      }

      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 8px rgba(34, 197, 94, 0.6), 0 0 3px rgba(34, 197, 94, 0.8);
        }
        50% {
          box-shadow: 0 0 12px rgba(34, 197, 94, 0.8), 0 0 5px rgba(34, 197, 94, 1);
        }
      }

      /* Status banner */
      .status-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 600;
        transition: all 300ms ease;
        flex-shrink: 0;
      }

      .status-banner.disconnected {
        background: var(--error-soft);
        border: 1px solid rgba(239, 68, 68, 0.25);
        color: var(--error);
      }

      .status-banner.connected-unbound {
        background: var(--warning-soft);
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: var(--warning);
      }

      .status-banner.ready {
        background: var(--success-soft);
        border: 1px solid rgba(34, 197, 94, 0.25);
        color: var(--success);
      }

      .status-banner-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .status-banner-text {
        flex: 1;
      }

      .status-banner-hint {
        font-size: 10px;
        font-weight: 400;
        opacity: 0.8;
        margin-top: 2px;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .btn-primary:hover {
        opacity: 0.9;
      }

      .btn-primary:active {
        transform: scale(0.96);
      }

      .btn-secondary {
        background: var(--bg-medium);
        color: var(--accent);
        border: 1px solid var(--border);
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 140ms ease;
      }

      .btn-secondary:hover {
        opacity: 0.9;
      }

      .btn-secondary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-danger {
        background: var(--bg-medium);
        color: var(--error);
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 140ms ease;
      }

      .btn-danger:hover {
        background: var(--error-soft);
      }

      .btn-danger:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .port-actions {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .tab-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .messages-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .bound-tabs-list {
        margin-top: 6px;
        display: grid;
        gap: 3px;
        max-height: 60px;
        overflow-y: auto;
      }

      .bound-tab-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 6px;
        background: var(--bg-dark);
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        font-size: 10px;
      }

      .bound-tab-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text-secondary);
      }

      .btn-unbind-single {
        background: none;
        border: none;
        color: var(--error);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        padding: 0 3px;
        opacity: 0.6;
        transition: opacity 140ms ease;
      }

      .btn-unbind-single:hover {
        opacity: 1;
      }

      .row-compact {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }

      .row-compact > div {
        flex: 1;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center; gap: 8px">
        <h1>AivoRelay</h1>
        <div id="keepalive-indicator" class="keepalive-indicator" title="Keepalive Status"></div>
      </div>
      <span class="badge" id="message-count" title="Recent messages count">0</span>
    </header>

    <!-- Status Banner -->
    <div id="status-banner" class="status-banner disconnected">
      <svg class="status-banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div class="status-banner-text">
        <div id="status-banner-title">Disconnected</div>
        <div id="status-banner-hint" class="status-banner-hint">Waiting for connection...</div>
      </div>
    </div>

    <section class="card">
      <div class="row-compact">
        <div>
          <label for="port">Port</label>
          <input id="port" type="number" min="1" max="65535" step="1" inputmode="numeric" />
        </div>
        <div>
          <label for="password">Password <span id="password-saved" class="password-saved">Saved</span></label>
          <div class="password-wrapper">
            <input id="password" type="password" class="password-input" autocomplete="off" />
            <button type="button" id="password-toggle" class="password-toggle" title="Show/hide">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="server">
        <span>Server</span>
        <span class="server-url" id="server-url"></span>
      </div>
      <div class="status" id="status"></div>

      <div class="toggle-row">
        <label class="toggle-label" for="auto-send">
          <input id="auto-send" type="checkbox" />
          <span class="toggle-switch"></span>
          Auto-send
        </label>
        <span class="toggle-hint">Default for all tabs</span>
      </div>

      <div class="toggle-row">
        <label class="toggle-label" for="single-tab-mode">
          <input id="single-tab-mode" type="checkbox" checked />
          <span class="toggle-switch"></span>
          Single tab mode
        </label>
        <span class="toggle-hint">Auto-unbind others</span>
      </div>

      <div class="port-actions">
        <div class="tab-actions">
          <button id="bind-tab" class="btn-primary">Bind Tab</button>
          <button id="unbind-tab" class="btn-secondary" disabled style="display: none">Unbind</button>
          <button id="unbind-all" class="btn-secondary" disabled>Unbind All</button>
        </div>
        <span id="bound-status" style="font-size: 10px; color: var(--muted); flex: 1; text-align: right;">No tabs bound</span>
      </div>

      <div id="bound-tabs-list" class="bound-tabs-list" style="display: none"></div>
    </section>

    <section class="card messages-card">
      <div class="messages-header">
        <span>Messages</span>
        <button id="clear-messages" class="btn-danger" type="button">Clear</button>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
